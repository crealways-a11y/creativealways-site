<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#14100d" />
<title>Provador 360° · Jogou com Quem?</title>
<meta property="og:title" content="Provador 360° · Monte sua camisa com seu nome" />
<meta property="og:description" content="Gire o modelo com o dedo, coloque seu nome e número e veja nas costas antes de comprar." />
<meta property="og:image" content="https://creativealways.com.br/demo/jcq/img/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#14100d; --card:#1f1813; --line:rgba(250,246,239,.14); --gold:#e7cdac; --txt:#faf6ef; --mute:rgba(250,246,239,.62); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg); color:var(--txt); font-family:'Plus Jakarta Sans', system-ui, sans-serif; overflow-x:hidden; }
  body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    background: radial-gradient(ellipse 60% 42% at 50% 30%, rgba(150,112,82,.30), transparent 72%), linear-gradient(180deg,#1f1813,#14100d); }
  body::before { content:'Jogou com Quem?'; position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); font-family:Georgia, serif; font-style:italic;
    font-size:clamp(64px, 17vw, 200px); color:rgba(235,210,181,.05); white-space:nowrap; pointer-events:none; z-index:0; }
  header, main, footer { position:relative; z-index:1; }
  header { width:100%; max-width:520px; padding:14px 16px 0; display:flex; justify-content:space-between; align-items:center; }
  .brand { font-weight:700; font-size:15px; }
  .brand small { display:block; font-weight:500; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
  .tag { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); border:1px solid var(--line); padding:5px 9px; border-radius:99px; }
  main { width:100%; max-width:520px; padding:0 16px 20px; display:flex; flex-direction:column; gap:12px; }
  .stage { position:relative; width:min(100%, 46vh); aspect-ratio:760/1240; margin:0 auto; touch-action:none; cursor:grab; overflow:hidden; }
  .zoomwrap { position:absolute; inset:0; transform-origin:50% 50%; transition:scale .15s ease-out, translate .1s ease-out; }
  .frame { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .frame.on { opacity:1; }
  .print { position:absolute; transform-origin:50% 0; text-align:center; font-family:'Anton', Impact, sans-serif; text-transform:uppercase; line-height:1; pointer-events:none; white-space:nowrap; }
  .print .n { display:block; letter-spacing:.05em; }
  .print .k { display:block; letter-spacing:-.01em; }
  .print.light { color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.18); }
  .print.dark { color:#161616; mix-blend-mode:multiply; }
  .zoom-reset { position:absolute; left:50%; top:8px; transform:translateX(-50%); z-index:5; display:none; padding:8px 14px; border-radius:99px;
    background:rgba(18,14,11,.85); border:1px solid rgba(235,210,181,.4); color:var(--gold); font-size:12px; font-weight:600; }
  .stage.zoomed .zoom-reset { display:block; }
  .ctrl { display:flex; justify-content:center; align-items:center; gap:10px; margin-top:-2px; }
  .ctrl button { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--txt); font-size:18px; }
  .ctrl span { font-size:12px; color:var(--mute); min-width:150px; text-align:center; }
  .shirts { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .shirt { display:flex; gap:10px; align-items:center; padding:8px; border-radius:14px; border:1px solid var(--line); background:var(--card); text-align:left; color:var(--txt); min-width:0; }
  .shirt img { width:42px; height:68px; object-fit:cover; border-radius:8px; background:#2a211b; }
  .shirt > span { min-width:0; }
  .shirt b { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shirt small { font-size:11.5px; color:var(--mute); }
  .shirt.on { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .fields { display:grid; grid-template-columns:minmax(0,1fr) 92px; gap:10px; }
  label { font-size:11.5px; color:var(--mute); display:block; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:#120e0b; color:var(--txt); font-size:16px; font-weight:600; text-transform:uppercase; }
  input:focus { outline:none; border-color:var(--gold); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--txt); font-weight:600; font-size:13px; }
  .chip.on { background:var(--gold); color:#191410; border-color:var(--gold); }
  .price { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .price span { font-size:13px; color:var(--mute); }
  .price b { font-size:20px; color:var(--gold); }
  .cta { display:block; text-align:center; text-decoration:none; padding:15px; border-radius:99px; background:linear-gradient(135deg,#f1dcc0,#c9a07a); color:#191410; font-weight:700; font-size:15px; }
  footer { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); text-align:center; padding:4px 0 18px; }
  @media (pointer: coarse) { .frame { transition:none; } }
</style>
</head>
<body>
<header>
  <div class="brand">Jogou com Quem?<small>Provador 360°</small></div>
  <span class="tag">Prévia</span>
</header>
<main>
  <div class="stage" id="stage">
    <div class="zoomwrap" id="zw">
      <div id="frames"></div>
      <div class="print" id="print"><span class="n" id="pN"></span><span class="k" id="pK"></span></div>
    </div>
    <button class="zoom-reset" id="zr" type="button">Voltar ao tamanho normal</button>
  </div>
  <div class="ctrl"><button type="button" id="prev" aria-label="Girar para a esquerda">‹</button><span id="hint">Arraste para girar · pinça para zoom</span><button type="button" id="next" aria-label="Girar para a direita">›</button></div>
  <div class="shirts" id="shirts"></div>
  <div class="fields">
    <div><label for="iName">Nome nas costas</label><input id="iName" maxlength="12" placeholder="SEU NOME" autocomplete="off" /></div>
    <div><label for="iNum">Número</label><input id="iNum" inputmode="numeric" maxlength="2" placeholder="10" autocomplete="off" /></div>
  </div>
  <div><label>Versão</label><div class="row" id="vers"></div></div>
  <div><label>Tamanho</label><div class="row" id="sizes"></div></div>
  <div class="price"><span id="sum"></span><b id="val"></b></div>
  <a class="cta" id="cta" target="_blank" rel="noopener">Quero essa no WhatsApp</a>
</main>
<footer>Prévia · Creative Always</footer>
<script src="print.js?v=1"></script>
<script>
(() => {
  const V = '?v=1';
  const KITS = [
    { id: 'fla', name: 'Flamengo III 26/27', kit: 'camisa + calção', ink: 'light' },
    { id: 'vasco', name: 'Vasco Círio de Nazaré 26', kit: 'camisa + calção', ink: 'dark' }
  ];
  const VERS = [{ id: 'Torcedor', price: 'R$ 179,90' }, { id: 'Jogador', price: 'R$ 199,90' }];
  const SIZES = ['P', 'M', 'G', 'GG', 'Infantil'];
  const WA = '5527988140076';
  const N = 24;
  const $ = (s) => document.querySelector(s);
  const q = new URLSearchParams(location.search);
  const st = { kit: KITS.find((k) => k.id === q.get('camisa')) || KITS[0], ver: VERS[0], size: 'M', deg: 0, target: 0, vel: 0, drag: false, auto: true };
  if (q.get('angulo')) { st.deg = st.target = Number(q.get('angulo')) || 0; st.auto = false; }
  $('#iName').value = (q.get('nome') || 'ELISEU').slice(0, 12);
  $('#iNum').value = (q.get('numero') || '10').replace(/\D/g, '').slice(0, 2);

  const src = (k, i) => `img/f/${k}_${String(i * 15).padStart(3, '0')}.webp${V}`;
  let imgs = [];
  function mount() {
    const box = $('#frames'); box.innerHTML = '';
    imgs = Array.from({ length: N }, (_, i) => { const im = document.createElement('img'); im.className = 'frame'; im.alt = ''; im.decoding = 'async'; im.src = src(st.kit.id, i); box.appendChild(im); return im; });
    cur = -1; draw();
  }
  // pré-carrega a outra camisa depois de um tempo, sem travar a abertura
  setTimeout(() => KITS.forEach((k) => { if (k !== st.kit) for (let i = 0; i < N; i++) { const im = new Image(); im.src = src(k.id, i); } }), 3500);

  let cur = -1;
  const norm = (d) => ((d % 360) + 360) % 360;
  function draw() {
    const i = Math.round(norm(st.deg) / 15) % N;
    if (i !== cur) { if (imgs[cur]) imgs[cur].classList.remove('on'); imgs[i].classList.add('on'); cur = i; placePrint(i); }
  }
  function placePrint(i) {
    const p = (window.PRINT && window.PRINT[st.kit.id] || [])[i];
    const el = $('#print');
    const name = $('#iName').value.trim().toUpperCase(), num = $('#iNum').value.replace(/\D/g, '').slice(0, 2);
    el.className = 'print ' + st.kit.ink;
    if (!p || p.o <= 0 || (!name && !num)) { el.style.display = 'none'; return; }
    const W = $('#stage').clientWidth;
    el.style.display = 'block'; el.className = 'print ' + st.kit.ink;
    el.style.left = (p.x * 100) + '%'; el.style.top = (p.y * 100) + '%';
    el.style.transform = `translateX(-50%) scaleX(${p.sx.toFixed(3)})`;
    el.style.opacity = p.o.toFixed(2);
    $('#pN').style.fontSize = (W * p.w * 0.16) + 'px';
    $('#pK').style.fontSize = (W * p.w * 0.38) + 'px';
    $('#pN').textContent = name; $('#pK').textContent = num;
  }

  let lastT = 0;
  function loop(t) {
    const dt = lastT ? Math.min(6, (t - lastT) / 16.67) : 1; lastT = t;
    if (st.auto && !st.drag) st.target += 0.45 * dt;
    else if (!st.drag && Math.abs(st.vel) > 0.05) { st.target += st.vel * dt; st.vel *= Math.pow(0.92, dt); }
    st.deg += (st.target - st.deg) * (1 - Math.pow(1 - (st.drag ? 0.35 : 0.14), dt));
    draw(); requestAnimationFrame(loop);
  }

  // toque: 1 dedo gira; 2 dedos = pinça (zoom); com zoom, 1 dedo move a imagem
  const stage = $('#stage'), zw = $('#zw');
  const Z = { z: 1, x: 0, y: 0, p: new Map(), pinch: null, pan: null };
  const applyZ = () => { if (Z.z <= 1.02) { Z.z = 1; Z.x = 0; Z.y = 0; } zw.style.scale = String(Z.z); zw.style.translate = `${Z.x}px ${Z.y}px`; stage.classList.toggle('zoomed', Z.z > 1); };
  let lx = 0;
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.zoom-reset')) return;
    Z.p.set(e.pointerId, { x: e.clientX, y: e.clientY }); try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    st.auto = false;
    if (Z.p.size === 2) { const [a, b] = [...Z.p.values()]; Z.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: Z.z }; st.drag = false; return; }
    if (Z.z > 1) { Z.pan = { x: e.clientX, y: e.clientY, ox: Z.x, oy: Z.y }; return; }
    st.drag = true; lx = e.clientX; st.vel = 0;
  });
  stage.addEventListener('pointermove', (e) => {
    if (!Z.p.has(e.pointerId)) return;
    Z.p.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (Z.pinch && Z.p.size === 2) { const [a, b] = [...Z.p.values()]; Z.z = Math.max(1, Math.min(3, Z.pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / Z.pinch.d)); applyZ(); return; }
    if (Z.pan) { Z.x = Z.pan.ox + e.clientX - Z.pan.x; Z.y = Z.pan.oy + e.clientY - Z.pan.y; applyZ(); return; }
    if (st.drag) { const dx = e.clientX - lx; lx = e.clientX; const d = dx * (e.pointerType === 'touch' ? 0.7 : 0.5); st.target += d; st.vel = st.vel * 0.4 + d * 0.6; }
  });
  const end = (e) => { Z.p.delete(e.pointerId); if (Z.p.size < 2) Z.pinch = null; if (Z.p.size === 0) { Z.pan = null; st.drag = false; } };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  $('#zr').addEventListener('click', () => { Z.z = 1; applyZ(); });
  $('#prev').addEventListener('click', () => { st.auto = false; st.target -= 30; });
  $('#next').addEventListener('click', () => { st.auto = false; st.target += 30; });

  function render() {
    document.querySelectorAll('.shirt').forEach((b) => b.classList.toggle('on', b.dataset.id === st.kit.id));
    document.querySelectorAll('#vers .chip').forEach((b) => b.classList.toggle('on', b.dataset.v === st.ver.id));
    document.querySelectorAll('#sizes .chip').forEach((b) => b.classList.toggle('on', b.dataset.s === st.size));
    const name = $('#iName').value.trim().toUpperCase(), num = $('#iNum').value.replace(/\D/g, '').slice(0, 2);
    $('#sum').textContent = 'Camisa ' + st.ver.id.toLowerCase() + (name || num ? ' · ' + [name, num].filter(Boolean).join(' ') : '');
    $('#val').textContent = st.ver.price;
    const msg = 'Oi! Montei minha camisa no provador:\n• ' + st.kit.name + ' (' + st.ver.id + ')\n• Tamanho: ' + st.size + (name ? '\n• Nome: ' + name : '') + (num ? '\n• Número: ' + num : '') + '\nTem disponível?';
    $('#cta').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg);
    if (cur >= 0) placePrint(cur);
  }
  $('#shirts').innerHTML = KITS.map((k) => `<button class="shirt" type="button" data-id="${k.id}"><img src="img/f/${k.id}_000.webp${V}" alt=""><span><b>${k.name}</b><small>${k.kit} · R$ 179,90</small></span></button>`).join('');
  $('#vers').innerHTML = VERS.map((v) => `<button class="chip" type="button" data-v="${v.id}">${v.id}</button>`).join('');
  $('#sizes').innerHTML = SIZES.map((s) => `<button class="chip" type="button" data-s="${s}">${s}</button>`).join('');
  document.querySelectorAll('.shirt').forEach((b) => b.addEventListener('click', () => { const k = KITS.find((x) => x.id === b.dataset.id); if (k !== st.kit) { st.kit = k; Z.z = 1; applyZ(); mount(); } render(); }));
  document.querySelectorAll('#vers .chip').forEach((b) => b.addEventListener('click', () => { st.ver = VERS.find((v) => v.id === b.dataset.v); render(); }));
  document.querySelectorAll('#sizes .chip').forEach((b) => b.addEventListener('click', () => { st.size = b.dataset.s; render(); }));
  // ao digitar, gira a camisa para mostrar as costas
  ['#iName', '#iNum'].forEach((s) => $(s).addEventListener('input', () => { st.auto = false; const k = Math.round((st.target - 180) / 360); st.target = 180 + 360 * k; render(); }));
  mount(); render(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
