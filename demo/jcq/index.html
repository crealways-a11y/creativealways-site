<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#14100d" />
<title>Monte sua camisa · Prévia</title>
<meta property="og:title" content="Monte sua camisa com seu nome e número" />
<meta property="og:description" content="Escolha a camisa, coloque seu nome e número e veja nas costas antes de comprar." />
<meta property="og:image" content="https://creativealways.com.br/demo/jcq/img/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#14100d; --card:#1f1813; --line:rgba(250,246,239,.14); --gold:#e7cdac; --txt:#faf6ef; --mute:rgba(250,246,239,.62); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg); color:var(--txt); font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    background: radial-gradient(ellipse 70% 50% at 50% 34%, rgba(150,112,82,.28), transparent 70%), linear-gradient(180deg,#1f1813,#14100d); }
  header { width:100%; max-width:520px; padding:16px 16px 6px; display:flex; justify-content:space-between; align-items:center; }
  .brand { font-weight:700; font-size:15px; letter-spacing:.02em; }
  .brand small { display:block; font-weight:500; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
  .tag { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); border:1px solid var(--line); padding:5px 9px; border-radius:99px; }
  main { width:100%; max-width:520px; padding:0 16px 24px; display:flex; flex-direction:column; gap:14px; }
  .stage { position:relative; width:100%; aspect-ratio:896/1200; max-height:56vh; margin:0 auto; perspective:1400px; touch-action:pan-y; cursor:grab; }
  .flip { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.22,1,.36,1); }
  .flip.is-back { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; justify-content:center; }
  .face img { height:100%; width:auto; max-width:100%; object-fit:contain; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none;
    -webkit-mask-image: radial-gradient(ellipse 62% 58% at 50% 48%, #000 72%, transparent 100%); mask-image: radial-gradient(ellipse 62% 58% at 50% 48%, #000 72%, transparent 100%); }
  html, body { overflow-x:hidden; }
  .toggle, .shirts { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .shirt { min-width:0; }
  .shirt > span { min-width:0; }
  .shirt b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fields { grid-template-columns:minmax(0,1fr) 92px; }
  .face.back { transform:rotateY(180deg); }
  .print { position:absolute; left:0; right:0; text-align:center; font-family:'Anton', Impact, sans-serif; text-transform:uppercase; pointer-events:none; line-height:1; }
  .print.name { top:24%; font-size:min(6.2vw, 30px); letter-spacing:.06em; }
  .print.num { top:31%; font-size:min(33vw, 168px); letter-spacing:-.01em; }
  .print.light { color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.18); opacity:.96; }
  .print.dark { color:#151515; mix-blend-mode:multiply; opacity:.92; }
  .hint { text-align:center; font-size:12px; color:var(--mute); margin-top:-4px; }
  .toggle { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btn { padding:12px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--txt); font-weight:600; font-size:14px; }
  .btn.on { background:var(--gold); color:#191410; border-color:var(--gold); }
  .shirts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .shirt { display:flex; gap:10px; align-items:center; padding:8px; border-radius:14px; border:1px solid var(--line); background:var(--card); text-align:left; color:var(--txt); }
  .shirt img { width:46px; height:60px; object-fit:cover; border-radius:8px; }
  .shirt b { display:block; font-size:13px; }
  .shirt span { font-size:11.5px; color:var(--mute); }
  .shirt.on { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .fields { display:grid; grid-template-columns:1fr 92px; gap:10px; }
  label { font-size:11.5px; color:var(--mute); display:block; margin-bottom:6px; }
  input { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:#120e0b; color:var(--txt); font-size:16px; font-weight:600; text-transform:uppercase; }
  input:focus { outline:none; border-color:var(--gold); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--txt); font-weight:600; font-size:13px; }
  .chip.on { background:var(--gold); color:#191410; border-color:var(--gold); }
  .price { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .price b { font-size:20px; color:var(--gold); }
  .cta { display:block; text-align:center; text-decoration:none; padding:15px; border-radius:99px; background:linear-gradient(135deg,#f1dcc0,#c9a07a); color:#191410; font-weight:700; font-size:15px; }
  footer { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); text-align:center; padding:4px 0 18px; }
</style>
</head>
<body>
<header>
  <div class="brand">Jogou com Quem?<small>Monte sua camisa</small></div>
  <span class="tag">Prévia</span>
</header>
<main>
  <div class="stage" id="stage">
    <div class="flip" id="flip">
      <div class="face front"><img id="imgFront" alt="Camisa de frente" /></div>
      <div class="face back"><img id="imgBack" alt="Camisa de costas" />
        <div class="print name" id="pName"></div>
        <div class="print num" id="pNum"></div>
      </div>
    </div>
  </div>
  <p class="hint">Arraste para o lado ou toque nos botões para virar a camisa</p>
  <div class="toggle">
    <button class="btn on" id="bFront" type="button">Frente</button>
    <button class="btn" id="bBack" type="button">Costas</button>
  </div>
  <div class="shirts" id="shirts"></div>
  <div class="fields">
    <div><label for="iName">Nome nas costas</label><input id="iName" maxlength="12" placeholder="SEU NOME" autocomplete="off" /></div>
    <div><label for="iNum">Número</label><input id="iNum" inputmode="numeric" maxlength="2" placeholder="10" autocomplete="off" /></div>
  </div>
  <div>
    <label>Versão</label>
    <div class="row" id="vers"></div>
  </div>
  <div>
    <label>Tamanho</label>
    <div class="row" id="sizes"></div>
  </div>
  <div class="price"><span id="sum">Camisa torcedor</span><b id="val">R$ 179,90</b></div>
  <a class="cta" id="cta" target="_blank" rel="noopener">Quero essa no WhatsApp</a>
</main>
<footer>Prévia · Creative Always</footer>
<script>
(() => {
  const SHIRTS = [
    { id: 'fla', name: 'Flamengo III 26/27', front: 'img/fla_frente.jpg', back: 'img/fla_costas.jpg', ink: 'light' },
    { id: 'vasco', name: 'Vasco Círio de Nazaré 26', front: 'img/vasco_frente.jpg', back: 'img/vasco_costas.jpg', ink: 'dark' }
  ];
  const VERS = [{ id: 'Torcedor', price: 'R$ 179,90' }, { id: 'Jogador', price: 'R$ 199,90' }];
  const SIZES = ['P', 'M', 'G', 'GG', 'Infantil'];
  const WA = '5527988140076';
  const st = { shirt: SHIRTS[0], ver: VERS[0], size: 'M', back: false };
  const $ = (s) => document.querySelector(s);
  const flip = $('#flip');

  // pré-carrega as 4 fotos (são poucas e leves)
  SHIRTS.forEach((s) => { [s.front, s.back].forEach((u) => { const i = new Image(); i.src = u; }); });

  function render() {
    $('#imgFront').src = st.shirt.front; $('#imgBack').src = st.shirt.back;
    const name = $('#iName').value.trim().toUpperCase(); const num = $('#iNum').value.replace(/\D/g, '').slice(0, 2);
    ['#pName', '#pNum'].forEach((s) => { const el = $(s); el.className = 'print ' + (s === '#pName' ? 'name ' : 'num ') + st.shirt.ink; });
    $('#pName').textContent = name; $('#pNum').textContent = num;
    flip.classList.toggle('is-back', st.back);
    $('#bFront').classList.toggle('on', !st.back); $('#bBack').classList.toggle('on', st.back);
    document.querySelectorAll('.shirt').forEach((b) => b.classList.toggle('on', b.dataset.id === st.shirt.id));
    document.querySelectorAll('#vers .chip').forEach((b) => b.classList.toggle('on', b.dataset.v === st.ver.id));
    document.querySelectorAll('#sizes .chip').forEach((b) => b.classList.toggle('on', b.dataset.s === st.size));
    $('#sum').textContent = 'Camisa ' + st.ver.id.toLowerCase() + (name || num ? ' · ' + [name, num].filter(Boolean).join(' ') : '');
    $('#val').textContent = st.ver.price;
    const msg = 'Oi! Montei minha camisa na prévia:\n• ' + st.shirt.name + ' (' + st.ver.id + ')\n• Tamanho: ' + st.size + (name ? '\n• Nome: ' + name : '') + (num ? '\n• Número: ' + num : '') + '\nTem disponível?';
    $('#cta').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg);
  }

  $('#shirts').innerHTML = SHIRTS.map((s) => `<button class="shirt" type="button" data-id="${s.id}"><img src="${s.front}" alt=""><span><b>${s.name}</b>a partir de R$ 179,90</span></button>`).join('');
  $('#vers').innerHTML = VERS.map((v) => `<button class="chip" type="button" data-v="${v.id}">${v.id}</button>`).join('');
  $('#sizes').innerHTML = SIZES.map((s) => `<button class="chip" type="button" data-s="${s}">${s}</button>`).join('');
  document.querySelectorAll('.shirt').forEach((b) => b.addEventListener('click', () => { st.shirt = SHIRTS.find((s) => s.id === b.dataset.id); render(); }));
  document.querySelectorAll('#vers .chip').forEach((b) => b.addEventListener('click', () => { st.ver = VERS.find((v) => v.id === b.dataset.v); render(); }));
  document.querySelectorAll('#sizes .chip').forEach((b) => b.addEventListener('click', () => { st.size = b.dataset.s; render(); }));
  $('#bFront').addEventListener('click', () => { st.back = false; render(); });
  $('#bBack').addEventListener('click', () => { st.back = true; render(); });
  // digitar já mostra as costas
  ['#iName', '#iNum'].forEach((s) => $(s).addEventListener('input', () => { if (!st.back) st.back = true; render(); }));

  // arrastar para o lado vira a camisa (só gesto horizontal claro; rolar a página continua normal)
  const stage = $('#stage'); let sx = null, sy = null;
  stage.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; });
  stage.addEventListener('pointerup', (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) { st.back = !st.back; render(); }
  });
  stage.addEventListener('pointercancel', () => { sx = null; });
  // link já personalizado: ?nome=RUBENS&numero=10&camisa=vasco
  const q = new URLSearchParams(location.search);
  if (q.get('nome')) $('#iName').value = q.get('nome').slice(0, 12);
  if (q.get('numero')) $('#iNum').value = q.get('numero').replace(/\D/g, '').slice(0, 2);
  if (q.get('camisa')) st.shirt = SHIRTS.find((s) => s.id === q.get('camisa')) || st.shirt;
  if (q.get('nome') || q.get('numero')) st.back = true;
  render();
})();
</script>
</body>
</html>
